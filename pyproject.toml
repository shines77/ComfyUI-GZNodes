[project]
# Unique identifier for your node. Immutable after creation.
name = "comfyui-gznodes"
# Custom Node version. Must be semantically versioned.
description = "Various quality of life -nodes for ComfyUI, mostly just visual stuff to improve usability."
version = "1.0.5"
license = {file = "LICENSE"}
# Filled in from requirements.txt
dynamic = []
## dynamic = ["dependencies"]

# classifiers = [
