#     "Environment :: GPU :: AMD ROCm",       # AMD ROCm support
#     "Environment :: GPU :: Intel Arc",      # Intel Arc support
#     "Environment :: NPU :: Huawei Ascend",  # Huawei Ascend support
#     "Environment :: GPU :: Apple Metal",    # Apple Metal support
# ]

[tool.setuptools.dynamic]
# dependencies = {file = ["requirements.txt"]}

[project.urls]
Repository = "https://github.com/shines77/ComfyUI-GZNodes"
#  Used by Comfy Registry https://registry.comfy.org
Documentation = "https://github.com/shines77/ComfyUI-GZNodes/wiki"
"Bug Tracker" = "https://github.com/shines77/ComfyUI-GZNodes/issues"

[tool.comfy]
# Your unique publisher identifier, typically matching your GitHub username.
PublisherId = "shines77"
# Display name for the Custom Node. Can be changed later.
DisplayName = "ComfyUI-GZNodes"
Icon = "https://avatars.githubusercontent.com/u/2806664"
includes = []
# "requires-comfyui" = ">=1.0.0"  # ComfyUI version compatibility
requires-comfyui = ">=1.0.0"  # ComfyUI version compatibility
